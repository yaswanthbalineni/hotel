name: Hotel Frontend Docker Build

on:
  push:
    branches:
      - feature/docker-ci-pipeline
      - dev
      - testing
      - production

  pull_request:
    branches:
      - dev
      - testing
      - production

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hotel-frontend:latest